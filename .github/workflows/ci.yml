name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # --- lint ---

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - run: nix develop --command uv sync --quiet
      - run: nix develop --command task format-check

  format-verilog-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - run: nix develop --command uv sync --quiet
      - run: nix develop --command task format-verilog-check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - run: nix develop --command uv sync --quiet
      - run: nix develop --command task lint-check

  lint-verilog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - run: nix develop --command uv sync --quiet
      - run: nix develop --command task lint-verilog

  lint-rtl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - run: nix develop --command uv sync --quiet
      - run: nix develop --command task lint-rtl

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - run: nix develop --command uv sync --quiet
      - run: nix develop --command task typecheck

  # --- test ---

  test:
    needs: [format-check, lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - run: nix develop --command uv sync --quiet
      - run: nix develop --command task test

  # --- sim ---

  sim:
    needs: [format-verilog-check, lint-verilog, lint-rtl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - run: nix develop --command uv sync --quiet
      - run: nix develop --command task verilog
      - run: nix develop --command task sim

  # --- formal ---

  formal:
    needs: [format-verilog-check, lint-verilog, lint-rtl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - run: nix develop --command uv sync --quiet
      - run: nix develop --command task formal

  # --- build ---

  build:
    needs: [test, sim, formal]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - run: nix develop --command uv sync --quiet
      - run: nix develop --command task build
