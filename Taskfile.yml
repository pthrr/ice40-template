version: "3"

vars:
  BOARD: '{{.BOARD | default "ice40_hx8k_evn"}}'
  TB: '{{.TB | default "tb_top"}}'
  TEST: '{{.TEST | default ""}}'
  VCD: '{{.VCD | default ""}}'

tasks:
  build:
    desc: Build for FPGA
    cmds:
      - uv run python scripts/build.py --board {{.BOARD}}

  boards:
    desc: List available boards
    cmds:
      - uv run python scripts/build.py --list-boards

  verilog:
    desc: Generate Verilog from Amaranth
    cmds:
      - uv run python scripts/build.py --verilog-only

  sim:
    desc: Run Verilator simulation
    cmds:
      - uv run python scripts/sim.py --testbench {{.TB}}

  waves:
    desc: View waveforms in GTKWave
    cmds:
      - bash -c 'VCD="{{.VCD}}"; if [ -z "$VCD" ]; then VCD=$(find build/sim -name "*.vcd" -type f | head -n1); fi; if [ -f "$VCD" ]; then gtkwave "$VCD" & else echo "No VCD file. Run task sim first"; exit 1; fi'

  test:
    desc: Run Python tests
    cmds:
      - uv run nox -s tests

  typecheck:
    desc: Run type checking
    cmds:
      - uv run ty check hdl/

  format:
    desc: Format Python code
    cmds:
      - uv run ruff format .

  format-verilog:
    desc: Format Verilog/SystemVerilog
    cmds:
      - find rtl testbenches -name "*.sv" -o -name "*.v" | xargs -r verible-verilog-format --inplace

  lint:
    desc: Lint Python code
    cmds:
      - uv run ruff check --fix .

  format-check:
    desc: Check Python formatting (no modifications)
    cmds:
      - uv run ruff format --check .

  format-verilog-check:
    desc: Check Verilog/SystemVerilog formatting (no modifications)
    cmds:
      - find rtl testbenches -name "*.sv" -o -name "*.v" | xargs -r verible-verilog-format --verify

  lint-check:
    desc: Lint Python code (no auto-fix)
    cmds:
      - uv run ruff check .

  lint-verilog:
    desc: Lint Verilog/SystemVerilog
    cmds:
      - find rtl testbenches -name "*.sv" -o -name "*.v" | xargs -r verible-verilog-lint

  lint-rtl:
    desc: Verilator lint RTL
    cmds:
      - verilator --lint-only -Wall rtl/*.sv

  formal:
    desc: Run SymbiYosys formal verification
    cmds:
      - sby -f formal/counter.sby prove
      - sby -f formal/counter.sby cover

  check:
    desc: Run all checks
    cmds:
      - task: typecheck
      - task: lint
      - task: lint-rtl
      - task: test

  program:
    desc: Program FPGA with iceprog
    preconditions:
      - sh: test -f build/fpga/{{.BOARD}}/top.bin
        msg: "Bitstream not found. Run 'task build' first."
    cmds:
      - iceprog build/fpga/{{.BOARD}}/top.bin

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf build/
      - rm -rf formal/counter_*/
      - find . -type d -name __pycache__ -exec rm -rf {} +
      - find . -type d -name .pytest_cache -exec rm -rf {} +
      - find . -type d -name .nox -exec rm -rf {} +
      - find . -type f -name "*.pyc" -delete
